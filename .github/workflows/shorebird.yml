name: Shorebird Release & Patch

on:
  push:
    branches:
      - main
    paths:
      - 'mlm_flutter_app/**'
      - '.github/workflows/shorebird.yml'
  workflow_dispatch:
    inputs:
      action_type:
        description: 'Action (release = Build Base APK with OTA support, patch = Send OTA Patch)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - patch

jobs:
  shorebird:
    name: Run Shorebird (${{ github.event.inputs.action_type || 'patch' }})
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Accept Android Licenses
        run: yes "y" | flutter doctor --android-licenses || true

      - name: Install Dependencies
        working-directory: ./mlm_flutter_app
        run: flutter pub get

      - name: Make gradlew executable
        run: |
          if [ -f mlm_flutter_app/android/gradlew ]; then
            chmod +x mlm_flutter_app/android/gradlew
          fi

      - name: Shorebird Doctor
        working-directory: ./mlm_flutter_app
        run: shorebird doctor -v

      - name: Build Base Flutter APK
        if: ${{ github.event.inputs.action_type == 'release' }}
        working-directory: ./mlm_flutter_app
        run: flutter build apk --release -v

      - name: Run Shorebird Release (APK)
        if: ${{ github.event.inputs.action_type == 'release' }}
        working-directory: ./mlm_flutter_app
        run: |
          echo "Starting Shorebird Release..."
          shorebird release android --artifact=apk --no-confirm --verbose || {
            echo "⚠️ Shorebird release encountered a notice; proceeding with built APK."
          }

      - name: Upload Shorebird Release APK
        if: ${{ github.event.inputs.action_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKuberaa-Shorebird-Release-APK
          path: |
            mlm_flutter_app/build/app/outputs/flutter-apk/*.apk
            mlm_flutter_app/build/app/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Run Shorebird Patch (OTA)
        if: ${{ github.event_name == 'push' || github.event.inputs.action_type == 'patch' }}
        working-directory: ./mlm_flutter_app
        run: |
          echo "Starting Shorebird OTA Patch..."
          shorebird patch android --release-version=latest --no-confirm --allow-asset-diffs --allow-native-diffs --verbose

