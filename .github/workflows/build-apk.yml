name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:


jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Accept Android Licenses
        run: yes "y" | flutter doctor --android-licenses || true

      - name: Make gradlew executable
        run: |
          if [ -f mlm_flutter_app/android/gradlew ]; then
            chmod +x mlm_flutter_app/android/gradlew
          fi

      - name: Install Dependencies
        working-directory: ./mlm_flutter_app
        run: flutter pub get

      - name: Build Flutter Release APK
        working-directory: ./mlm_flutter_app
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKuberaa-Release-APK
          path: mlm_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

