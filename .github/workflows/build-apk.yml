name: Run Shorebird (release)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Run Shorebird Release (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes "y" | flutter doctor --android-licenses || true

      - name: Make gradlew executable
        run: |
          if [ -f mlm_flutter_app/android/gradlew ]; then
            chmod +x mlm_flutter_app/android/gradlew
          fi

      - name: Install Dependencies
        working-directory: ./mlm_flutter_app
        run: flutter pub get

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Run Shorebird Patch (OTA)
        working-directory: ./mlm_flutter_app
        run: shorebird patch android --no-confirm
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

      - name: Upload Shorebird Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RoyalKuberaa-Shorebird-APK
          path: mlm_flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
